# Children's travel documents (Wyjazdy). Official sources only (*.gov.pl, checked by the loader).
# Facts in our own words; `short` is what the page shows, `note` the detail behind it.
# Where official sources disagree, the fact is `to_confirm = true` and names both.
title = "Dokumenty dziecka na wyjazd"

[[group]]
id = "dokument"
title = "Jaki dokument"
icon = "info"

[[group]]
id = "dowod"
title = "Dowód osobisty dziecka"
icon = "card"
intro = "Wystarczy w krajach, które wpuszczają na dowód. Jest bezpłatny."

[[group]]
id = "paszport"
title = "Paszport dla dziecka"
icon = "plane"
intro = "Potrzebny poza krajami, które wpuszczają na dowód."

[[group]]
id = "ekuz"
title = "EKUZ (Europejska Karta Ubezpieczenia Zdrowotnego)"
icon = "medical"
intro = "Leczenie w publicznej opiece zdrowotnej w krajach UE i kilku innych, na zasadach tego kraju."

[[group]]
id = "zgoda"
title = "Wyjazd z jednym rodzicem"
icon = "people"

