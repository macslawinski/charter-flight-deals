# --- one parent -------------------------------------------------------------------------------

[[fact]]
group = "zgoda"
key = "consent-holiday"
short = "Źródła urzędowe się różnią. Ministerstwo Sprawiedliwości: wyjazd na wakacje za granicę wymaga zgody obojga rodziców z władzą rodzicielską."
note = "Według Ministerstwa, gdy zgody brak, potrzebne jest orzeczenie sądu opiekuńczego. Europejskie Centrum Konsumenckie pisze natomiast, że przy wspólnej władzy rodzicielskiej zgoda drugiego rodzica na czasowy wyjazd co do zasady nie jest wymagana, i radzi sprawdzić wymagania kraju docelowego."
publisher = "Ministerstwo Sprawiedliwości (Stop uprowadzeniom dzieci)"
url = "https://www.gov.pl/web/stopuprowadzeniomdzieci/pytanie2"
verified_at = 2026-11-08
to_confirm = true
also = [{ label = "Europejskie Centrum Konsumenckie", url = "https://konsument.gov.pl/aktualne/podroze-malych-i-duzych/" }]

[[fact]]
group = "zgoda"
key = "consent-form"
short = "Portal Powroty radzi: pisemna zgoda drugiego rodzica z podpisem poświadczonym przez notariusza i skrócony odpis aktu urodzenia dziecka."
note = "Przy wyjeździe za granicę portal radzi też tłumaczenie przysięgłe zgody, najlepiej na język kraju docelowego. Tekst portalu pochodzi z 21 września 2020 r."
publisher = "Powroty (powroty.gov.pl)"
url = "https://powroty.gov.pl/podroz-z-dzieckiem-za-granice/"
verified_at = 2026-11-08
