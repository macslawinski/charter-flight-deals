# Vaccination calendar for children 0-6 (Niezbędnik rodzica). Official sources only (*.gov.pl, checked by
# the loader). Main source: Programme of Protective Vaccinations (PSO) for 2027, communiqué of the Chief
# Sanitary Inspector of 2026-10-28, Dz. Urz. Min. Zdr. 2026 poz. 77 (part I.A, I.A.1-A.2, II.H, V, VII.A-B),
# read from the PDF on 2026-11-08. Facts in our own words; no medical advice. A new PSO is published every
# autumn for the next year: re-verify yearly (November).
title = "Kalendarz szczepień"

[[group]]
id = "zasady"
title = "Skąd jest ten kalendarz"
icon = "info"
intro = "Program Szczepień Ochronnych (PSO) ogłasza co roku Główny Inspektor Sanitarny. Poniżej program na rok 2027."

[[group]]
id = "pierwszy-rok"
title = "Szczepienia obowiązkowe w 1. roku życia"
icon = "calendar"
intro = "Wariant podstawowy z PSO: osobne szczepionki. Dokładny termin każdej dawki ustala lekarz przy badaniu kwalifikacyjnym."

[[group]]
id = "do-szesciu-lat"
title = "Szczepienia obowiązkowe w 2. i 6. roku życia"
icon = "calendar"

[[group]]
id = "skojarzone"
title = "Szczepionki 5w1 i 6w1"
icon = "shield"

[[group]]
id = "zalecane"
title = "Szczepienia zalecane do 6 lat"
icon = "medical"
intro = "Nie są obowiązkowe. PSO je zaleca; część jest bezpłatna albo refundowana, część płatna."

