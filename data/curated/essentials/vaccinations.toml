# --- first year ------------------------------------------------------------------------------

[[fact]]
group = "pierwszy-rok"
key = "birth"
short = "Od 1. doby życia, najpóźniej do wypisu ze szpitala: gruźlica (BCG) i 1. dawka przeciw WZW typu B."
publisher = "GIS"
url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf"
verified_at = 2026-11-08

[[fact]]
group = "pierwszy-rok"
key = "month-2"
short = "W 2. miesiącu (po 6. tygodniu): rotawirusy, WZW typu B (2. dawka), błonica, tężec i krztuściec (DTP), Hib, pneumokoki."
note = "Rotawirusy: 2 lub 3 dawki, zależnie od szczepionki. Dzieci urodzone przed 37. tygodniem ciąży albo z masą urodzeniową poniżej 2500 g dostają szczepionkę z bezkomórkowym komponentem krztuśca."
publisher = "GIS"
url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf"
verified_at = 2026-11-08

[[fact]]
group = "pierwszy-rok"
key = "month-4"
short = "W 4. miesiącu: rotawirusy (2. dawka), polio (IPV, 1. dawka), DTP, Hib i pneumokoki (2. dawka)."
note = "Rotawirusy 4 tygodnie po pierwszej dawce. Polio od ukończenia 12. tygodnia życia. DTP, Hib i pneumokoki od ukończenia 12. tygodnia, 8 tygodni po pierwszej dawce."
publisher = "GIS"
url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf"
verified_at = 2026-11-08

[[fact]]
group = "pierwszy-rok"
key = "month-5-6"
short = "W 5.–6. miesiącu: 3. dawka przeciw rotawirusom (tylko szczepionka 3-dawkowa). W 6. miesiącu: DTP i Hib (3. dawka), polio (2. dawka)."
publisher = "GIS"
url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf"
verified_at = 2026-11-08

[[fact]]
group = "pierwszy-rok"
key = "month-7"
short = "W 7. miesiącu: 3. dawka przeciw WZW typu B, 5 miesięcy po drugiej."
publisher = "GIS"
url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf"
verified_at = 2026-11-08

# --- second and sixth year -------------------------------------------------------------------

[[fact]]
group = "do-szesciu-lat"
key = "month-13-15"
short = "W 13.–15. miesiącu: odra, świnka i różyczka (MMR) oraz 3. dawka przeciw pneumokokom."
note = "MMR to szczepionka żywa atenuowana; o terminie decyduje lekarz. Przebycie odry, świnki lub różyczki nie jest przeciwwskazaniem. Pneumokoki po ukończeniu 12. miesiąca, co najmniej 6 miesięcy po drugiej dawce."
publisher = "GIS"
url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf"
verified_at = 2026-11-08

[[fact]]
group = "do-szesciu-lat"
key = "month-16-18"
short = "W 16.–18. miesiącu: DTP i Hib (4. dawka) oraz polio (3. dawka)."
publisher = "GIS"
url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf"
verified_at = 2026-11-08

[[fact]]
group = "do-szesciu-lat"
key = "year-6"
short = "W 6. roku życia: dawki przypominające przeciw błonicy, tężcowi i krztuścowi (DTaP) i polio oraz 2. dawka MMR."
note = "Dziecko, które nie dostało drugiej dawki MMR w 6. roku życia, powinno ją uzupełnić jak najwcześniej."
publisher = "GIS"
url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf"
verified_at = 2026-11-08

[[fact]]
group = "do-szesciu-lat"
key = "varicella"
short = "Ospa wietrzna jest obowiązkowa tylko dla dzieci z grup ryzyka wskazanych w PSO; pozostałym jest zalecana: 2 dawki co najmniej 3 miesiące od siebie."
note = "W kalendarzu obowiązkowym zaznaczono ją w 10.–12. i 13.–15. miesiącu życia. Według serwisu szczepienia.pzh.gov.pl szczepionkę można podać po ukończeniu 9. miesiąca, optymalnie w 12., a poza grupami ryzyka jest płatna."
publisher = "GIS"
url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf"
verified_at = 2026-11-08
also = [{ label = "szczepienia.pzh.gov.pl: kalendarz 2026", url = "https://szczepienia.pzh.gov.pl/kalendarz-szczepien-2026/" }]

# --- combined vaccines -----------------------------------------------------------------------

[[fact]]
group = "skojarzone"
key = "combined-variants"
short = "PSO ma też warianty z jedną szczepionką zamiast kilku: 5w1 (błonica, tężec, krztuściec, polio, Hib) albo 6w1 (to samo i WZW typu B)."
note = "5w1: dawki w 2., 4., 6.–7. i 16.–18. miesiącu; WZW typu B osobno (po urodzeniu, w 2. i 6.–7. miesiącu). 6w1: dawki w 2., 4., 5.–6. i 16.–18. miesiącu, po urodzeniu osobna dawka przeciw WZW typu B; rotawirusy w 2., 3. i (przy 3 dawkach) 4. miesiącu. BCG, pneumokoki i MMR w obu wariantach w tych samych miesiącach co w podstawowym."
publisher = "GIS"
url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf"
verified_at = 2026-11-08

[[fact]]
group = "skojarzone"
key = "combined-cost"
short = "Źródła różnią się w sprawie opłat: pacjent.gov.pl podaje, że szczepionki wysoko skojarzone są odpłatne, a PSO 2027 nie mówi, kto za nie płaci."
note = "pacjent.gov.pl (kalendarz na 2026 r.): rodzice mogą zastąpić bezpłatne szczepionki preparatami wysoko skojarzonymi (odpłatnymi). PSO opisuje warianty 5w1 i 6w1 jako warianty „w populacji ogólnej dzieci do 2 lat”."
publisher = "pacjent.gov.pl"
url = "https://pacjent.gov.pl/kalendarz-szczepien-dzieci-i-mlodziezy-na-2026-rok"
verified_at = 2026-11-08
to_confirm = true
also = [{ label = "PSO na rok 2027 (cz. I.A.1–A.2)", url = "https://dziennikmz.mz.gov.pl/DUM_MZ/2026/77/akt.pdf" }]

