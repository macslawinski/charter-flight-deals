# Aegean Airlines: AEGEAN ForFamilies pages (infant up to 24 months, booking a family trip) and
# special assistance "Travelling with an infant", read 2026-11-05. Fare discounts are for tickets
# bought from Aegean; on a tour-operator charter the operator sets the price.
carrier = "A3"

[[rule]]
key = "infant_fee"
age_band = "0-2"
value = { discount_pct = 90, fare = "Family" }
short = "10% ceny dorosłego (taryfa Family)"
note = "W taryfach Family, Comfort Flex i Business bilet niemowlęcia (do 24 miesięcy, na kolanach) ma 90% zniżki. Kupując lot w biurze podróży, cenę sprawdź w biurze."
source = "carrier_official"
url = "https://en.aegeanair.com/travel-info/travelling-with-aegean/for-families/tickets-for-children_infants/"
verified_at = 2026-11-05

[[rule]]
key = "child_fare"
age_band = "2+"
value = { discount_pct = 40, fare = "Family", min_age = 2, max_age = 11 }
short = "Dziecko 2–11 lat: 40% zniżki (Family)"
note = "W taryfie Family bilet dziecka 2–11 lat ma 40% zniżki, w Comfort Flex i Business 20%. Od 12 lat obowiązuje bilet dorosłego."
source = "carrier_official"
url = "https://en.aegeanair.com/travel-info/travelling-with-aegean/for-families/tickets-for-children_infants/"
verified_at = 2026-11-05

[[rule]]
key = "infant_min_age"
value = { min_days = 0, doctor_note_under_days = 7 }
short = "Do 7. dnia życia z zaświadczeniem"
note = "Niemowlę młodsze niż 7 dni poleci tylko z zaświadczeniem lekarskim, że może podróżować i nie urodziło się przedwcześnie."
source = "carrier_official"
url = "https://en.aegeanair.com/travel-info/travelling-with-aegean/special-assistance/infants/"
verified_at = 2026-11-05

[[rule]]
key = "infants_per_adult"
age_band = "0-2"
value = { max = 1, adult_min_age = 16 }
short = "Jedno niemowlę na dorosłego (16+)"
note = "Jeden pasażer (od 16 lat) może lecieć z jednym niemowlęciem. Opiekun nie może jednocześnie mieć w kabinie zwierzęcia ani potrzebować pomocy w poruszaniu się."
source = "carrier_official"
url = "https://en.aegeanair.com/travel-info/travelling-with-aegean/for-families/traveling_with_infant"
verified_at = 2026-11-05

[[rule]]
key = "infant_baggage"
age_band = "0-2"
value = { cabin_kg = 6, cabin_dims_cm = "55x40x23", checked_kg_comfort_flex = 23 }
short = "Torba do 6 kg w kabinie"
note = "Niemowlę ma bezpłatnie jedną torbę do 6 kg (55×40×23 cm) z rzeczami do karmienia i przewijania. W Comfort Flex przysługuje mu też walizka do 23 kg, w Business do 32 kg."
source = "carrier_official"
url = "https://en.aegeanair.com/travel-info/travelling-with-aegean/for-families/traveling_with_infant"
verified_at = 2026-11-05

[[rule]]
key = "stroller"
age_band = "0-2"
value = { free = true, to_aircraft_door = true, foldable_required = true, items = ["stroller", "car_seat"] }
short = "Wózek gratis do drzwi samolotu"
note = "Wózek albo fotelik bezpłatnie: oddajesz go złożony przy wejściu do samolotu (musi być w pełni składany i oznaczony przy odprawie lub przy bramce), leci w luku. Dodatkowy fotelik zgłoś w call center jako bagaż specjalny."
source = "carrier_official"
url = "https://en.aegeanair.com/travel-info/travelling-with-aegean/for-families/traveling_with_infant"
verified_at = 2026-11-05

[[rule]]
key = "car_seat"
age_band = "0-2"
value = { own_seat_required = true, max_base_cm = "40x40", book_via = "call_center_or_agent", not_aisle = true }
short = "Fotelik tylko z własnym miejscem"
note = "Fotelik na pokładzie tylko z wykupionym osobnym miejscem (podstawa maks. 40×40 cm); płacisz za miejsce, nie za fotelik. Miejsce i fotelik w kabinie załatwisz tylko przez call center Aegean albo biuro."
source = "carrier_official"
url = "https://en.aegeanair.com/travel-info/travelling-with-aegean/for-families/traveling_with_infant"
verified_at = 2026-11-05

[[rule]]
key = "baby_food"
age_band = "0-2"
value = { milk_in_cabin_kg = 6 }
short = "Mleko w bagażu podręcznym"
note = "Mleko modyfikowane lub odciągnięte możesz wziąć w bagażu podręcznym (do 6 kg); kontrola bezpieczeństwa może je sprawdzić."
source = "carrier_official"
url = "https://en.aegeanair.com/travel-info/travelling-with-aegean/special-assistance/infants/"
verified_at = 2026-11-05

[[rule]]
key = "child_seating"
age_band = "0-2"
value = { no_exit_row = true, no_row_before_after_exit = true }
short = "Nie przy wyjściu awaryjnym"
note = "Niemowlę nie może siedzieć w rzędzie przy wyjściu awaryjnym ani w rzędach tuż przed i za nim."
source = "carrier_official"
url = "https://en.aegeanair.com/travel-info/travelling-with-aegean/for-families/traveling_with_infant"
verified_at = 2026-11-05
