# Corendon Airlines: baggage page "For infants", Rules & Regulations "Special conditions" and the FAQ
# (reservation, baggage operations, special conditions), read 2026-11-05. The pages apply to flight
# numbers XC and XR (Corendon Europe has the same rules); CD flights (Corendon Dutch) use corendon.nl.
# No infant fee is published: seats are mostly sold by tour operators.
carrier = "XC"

[[rule]]
key = "infant_fee"
age_band = "0-2"
value = { amount_published = false }
short = "Strona linii nie podaje opłaty"
note = "Corendon nie podaje na swojej stronie opłaty za niemowlę. Kupując lot w biurze podróży, cenę niemowlęcia sprawdź w biurze."
source = "carrier_official"
url = "https://www.corendonairlines.com/baggage-allowance/for-infants"
verified_at = 2026-11-05

[[rule]]
key = "infant_min_age"
value = { min_days = 8 }
short = "Od 8. dnia życia"
note = "Linia nie przewozi niemowląt młodszych niż 8 dni."
source = "carrier_official"
url = "https://www.corendonairlines.com/support-center/frequently-asked-questions/reservation"
verified_at = 2026-11-05

[[rule]]
key = "infant_baggage"
age_band = "0-2"
value = { checked_kg = 10, cabin_allowance = false, diaper_bag = true }
short = "10 kg bagażu rejestrowanego"
note = "Niemowlę ma 10 kg bagażu na każdym locie. Własnego bagażu podręcznego nie ma, ale na pokład wejdzie jedna torba z pieluchami i jedzeniem w wymiarach bagażu podręcznego."
source = "carrier_official"
url = "https://www.corendonairlines.com/support-center/frequently-asked-questions/baggage-operations"
verified_at = 2026-11-05

[[rule]]
key = "child_baggage"
age_band = "2+"
value = { same_as_adult = true }
short = "Od 2 lat bagaż jak dorosły"
note = "Dziecko od 2 lat ma taki sam bagaż rejestrowany jak dorosły, zależnie od wykupionej taryfy."
source = "carrier_official"
url = "https://www.corendonairlines.com/support-center/frequently-asked-questions/baggage-operations"
verified_at = 2026-11-05

[[rule]]
key = "stroller"
age_band = "0-2"
value = { free = true, hold = true, cabin = false, twin_stroller_ok = true, second_item_counts_to_adult_bag = true }
short = "Wózek lub fotelik gratis w luku"
note = "Jeden wózek (dla bliźniąt wózek podwójny) albo fotelik na niemowlę leci bezpłatnie w luku; do kabiny nie wejdzie. Drugi wózek lub wózek i fotelik też są bezpłatne, ale ich waga wlicza się do bagażu dorosłych."
source = "carrier_official"
url = "https://www.corendonairlines.com/baggage-allowance/for-infants"
verified_at = 2026-11-05

[[rule]]
key = "car_seat"
age_band = "0-2"
value = { cabin = false, hold_free = true }
short = "Fotelik tylko w luku"
note = "Ze względów bezpieczeństwa foteliki dziecięce nie są dozwolone w kabinie i nie da się ich przymocować do fotela. Fotelik leci bezpłatnie w luku zamiast wózka."
source = "carrier_official"
url = "https://www.corendonairlines.com/baggage-allowance/for-infants"
verified_at = 2026-11-05

[[rule]]
key = "travel_cot"
age_band = "0-2"
value = { free = false, counts_as_checked_bag = true }
short = "Łóżeczko wlicza się do bagażu"
note = "Łóżeczko turystyczne można zabrać, ale jego waga wlicza się do bagażu."
source = "carrier_official"
url = "https://www.corendonairlines.com/baggage-allowance/for-infants"
verified_at = 2026-11-05

[[rule]]
key = "baby_food"
age_band = "0-2"
value = { hot_water = true, ready_food_max_containers = 10, container_max_ml = 100 }
short = "Gorąca woda do mleka na pokładzie"
note = "Załoga poda gorącą wodę do mleka w proszku. Gotowe jedzenie dla niemowlęcia: łącznie do 10 pojemników lub butelek, każdy do 100 ml."
source = "carrier_official"
url = "https://www.corendonairlines.com/baggage-allowance/for-infants"
verified_at = 2026-11-05

[[rule]]
key = "child_seating"
age_band = "0-2"
value = { window_only = true, no_extra_legroom = true, no_exit_row_under_16 = true }
short = "Z niemowlęciem tylko przy oknie"
note = "Pasażer z niemowlęciem siedzi tylko przy oknie, bez miejsc z dodatkową przestrzenią na nogi. Z dziećmi poniżej 16 lat nie usiądziesz w rzędzie przy wyjściu awaryjnym."
source = "carrier_official"
url = "https://www.corendonairlines.com/support-center/frequently-asked-questions/special-conditions-faq"
verified_at = 2026-11-05
