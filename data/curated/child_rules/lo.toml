# LOT: "Przygotowanie dziecka do podróży samolotem" (lot.com, read 2026-11-04). Also operates
# "LOT Charters" seats sold by tour operators, which set their own prices.
carrier = "LO"

[[rule]]
key = "infant_fee"
age_band = "0-2"
value = { discount_pct_international = 90, discount_pct_domestic = 100 }
note = "Niemowlę na kolanach płaci 10% taryfy normalnej na lotach międzynarodowych, a na krajowych leci bezpłatnie. Kupując lot czarterowy w biurze podróży, cenę sprawdź w biurze."
source = "carrier_official"
url = "https://www.lot.com/pl/pl/podrozuj/specjalne-wymagania/lot-dla-dzieci/przed-podroza"
verified_at = 2026-11-04

[[rule]]
key = "infants_per_adult"
age_band = "0-2"
value = { max = 2, second_needs_own_seat_and_car_seat = true }
note = "Jeden dorosły może lecieć z dwójką maluchów do 2 lat, ale drugie dziecko potrzebuje własnego miejsca i fotelika samochodowego."
source = "carrier_official"
url = "https://www.lot.com/pl/pl/podrozuj/specjalne-wymagania/lot-dla-dzieci/przed-podroza"
verified_at = 2026-11-04

[[rule]]
key = "twins"
age_band = "0-2"
value = { one_adult_allowed = true, second_infant_own_seat = true }
note = "Z bliźniętami może lecieć jeden dorosły: jedno dziecko na kolanach, drugie na wykupionym miejscu w foteliku."
source = "carrier_official"
url = "https://www.lot.com/pl/pl/podrozuj/specjalne-wymagania/lot-dla-dzieci/przed-podroza"
verified_at = 2026-11-04

[[rule]]
key = "infant_baggage"
age_band = "0-2"
value = { cabin_kg = 8, personal_item_kg = 2, food_bag = true, checked_kg_except_economy_saver = 23 }
note = "Niemowlę: bagaż podręczny do 8 kg, przedmiot osobisty do 2 kg i torba z jedzeniem. W taryfach innych niż Economy Saver także bagaż rejestrowany do 23 kg."
source = "carrier_official"
url = "https://www.lot.com/pl/pl/podrozuj/specjalne-wymagania/lot-dla-dzieci/przed-podroza"
verified_at = 2026-11-04

[[rule]]
key = "stroller"
age_band = "0-2"
value = { lap_infant_free = "stroller_or_car_seat", own_seat_free = "stroller_and_car_seat" }
note = "Niemowlę na kolanach: bezpłatnie wózek albo fotelik (drugi z nich w bagażu rejestrowanym lub płatnie). Niemowlę z własnym miejscem: wózek i fotelik bezpłatnie."
source = "carrier_official"
url = "https://www.lot.com/pl/pl/podrozuj/specjalne-wymagania/lot-dla-dzieci/przed-podroza"
verified_at = 2026-11-04

[[rule]]
key = "stroller"
age_band = "2+"
value = { free = true, car_seat_free = true }
note = "Dzieci od 2 do 12 lat: wózek i fotelik bezpłatnie."
source = "carrier_official"
url = "https://www.lot.com/pl/pl/podrozuj/specjalne-wymagania/lot-dla-dzieci/przed-podroza"
verified_at = 2026-11-04

[[rule]]
key = "car_seat"
value = { certified_label = "certified for use in motor vehicles and aircraft", lap_belt_only = true, installed_by_passenger = true, unsuitable_goes_to_hold_free = true }
note = "Na pokładzie tylko certyfikowany fotelik mocowany zwykłym pasem samolotu (naklejka „certified for use in motor vehicles and aircraft”). Montujesz go sam. Fotelik niespełniający wymogów leci bezpłatnie w luku."
source = "carrier_official"
url = "https://www.lot.com/pl/pl/podrozuj/specjalne-wymagania/lot-dla-dzieci/przed-podroza"
verified_at = 2026-11-04

[[rule]]
key = "bassinet"
age_band = "0-2"
value = { aircraft = "B787 long-haul", book_hours_before = 24, max_kg = 12, max_cm = 75, own_bassinet_allowed = false }
note = "Kołyska tylko na lotach długodystansowych Dreamlinerem. Zamawiasz ją w Contact Center najpóźniej 24 h przed lotem. Dziecko do 12 kg i 75 cm. Własnej kołyski nie zabierzesz."
source = "carrier_official"
url = "https://www.lot.com/pl/pl/podrozuj/specjalne-wymagania/lot-dla-dzieci/przed-podroza"
verified_at = 2026-11-04

[[rule]]
key = "child_seating"
value = { free_seats_together = false, no_exit_rows = true }
note = "Żeby usiąść razem, wykup wybór miejsca. Inaczej miejsca przydzielane są przy odprawie i wolnych foteli obok siebie może brakować. Dzieci nie siedzą w rzędach przy wyjściach awaryjnych."
source = "carrier_official"
url = "https://www.lot.com/pl/pl/podrozuj/specjalne-wymagania/lot-dla-dzieci/przed-podroza"
verified_at = 2026-11-04

[[rule]]
key = "child_baggage"
age_band = "2+"
value = { same_as_adult = true }
note = "Dzieci od 2 lat mają taki sam limit bagażu jak dorośli."
source = "carrier_official"
url = "https://www.lot.com/pl/pl/podrozuj/specjalne-wymagania/lot-dla-dzieci/przed-podroza"
verified_at = 2026-11-04
