# Facts from the hotel's own website (hotel-jurata.com.pl; robots.txt allows the pages used, only CMS and file
# folders are disallowed; checked 2026-11-07): /pl/dzieci-w-hotelu/, /pl/faq/, home page. Written in our words.
# Also on the site, no feature key for it: children's footstools; swimming aids and pool toys; recreational pool
# 1.5 m deep (no brodzik mentioned); children 3-12 pay for an extra bed and get 50% off breakfast.
# Not stated (so not recorded yet): cot fee, changing table, bottle warmer, potty, kids menu, toddler food,
# playroom hours and minimum age, animation ages, lift, parking fee (the parking page's price list could not be read).
#
# Coordinates: OpenStreetMap way/906077352 (ODbL).
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Jurata halt (Hel line). Station -> hotel: ~1 km, ~5 min by car (OSRM) or a short walk.
