source = "hotel_website"
url = "https://www.green-mountain.pl/dla-dzieci"
verified_at = 2026-11-08

[[feature]]
key = "kids_animation"
value = { available = true, parent_present = true }
short = "Animacje w obecności rodziców"
note = "Podczas animacji dzieci pozostają pod opieką rodziców lub opiekunów, których obecność jest wymagana. Harmonogram jest w recepcji; wieku strona nie podaje."
source = "hotel_website"
url = "https://www.green-mountain.pl/dla-dzieci"
verified_at = 2026-11-08

[[feature]]
key = "playground"
