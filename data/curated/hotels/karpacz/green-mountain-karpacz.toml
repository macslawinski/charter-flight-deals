value = { available = true, depth_cm = 50 }
short = "Brodzik 50 cm"
note = "Dzieci mogą korzystać z brodzika o głębokości 50 cm. Godzin strona nie podaje."
source = "hotel_website"
url = "https://www.green-mountain.pl/dla-dzieci"
verified_at = 2026-11-08

[[feature]]
