# Facts from the hotel's own website (green-mountain.pl; robots.txt allows the pages, checked by the find-hotels
# probe 2026-11-08): /dla-dzieci, /atrakcje/animacje-dla-najmlodszych. Written in our words.
# Also on the site, no feature key for it: consoles and arcade games for older children; an outdoor pool in the summer season described as suitable also for the youngest; an offer with up to two children under 12 free (offer only).
# Not stated (so not recorded yet): cot, baby bath, high chair, changing table, potty, playroom hours and minimum age, animation ages, lift.
#
# Coordinates: OpenStreetMap node/6240452289 centre ((c) OpenStreetMap contributors, ODbL).
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Jelenia Góra station. Station -> hotel: ~18 km, ~25 min by car or taxi (OSRM).
slug = "green-mountain-karpacz"
place = "karpacz"
name = "Green Mountain Hotel"
official_url = "https://www.green-mountain.pl/"
address = "ul. Sarnia 21, 58-540 Karpacz"
lat = 50.7646256
lon = 15.7663482
status = "published"

[[feature]]
key = "child_free_stay"
age_band = "0-3"
value = { free = true, sleeping_with_parents = true }
short = "Do 3 lat gratis w łóżku rodziców"
note = "Dzieci w wieku do lat 3 nocują bezpłatnie, jeżeli śpią na łóżku rodziców. Strona nie mówi, czy dotyczy to także 3-latków."
source = "hotel_website"
url = "https://www.green-mountain.pl/atrakcje/animacje-dla-najmlodszych"
verified_at = 2026-11-08

[[feature]]
key = "kids_menu"
value = { available = true }
short = "Dania dla dzieci w restauracji"
note = "W restauracji są propozycje dopasowane do dziecięcych smaków."
source = "hotel_website"
url = "https://www.green-mountain.pl/dla-dzieci"
verified_at = 2026-11-08

[[feature]]
key = "playroom"
value = { available = true, ball_pool = true }
