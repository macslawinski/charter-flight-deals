#   change, to Jelenia Góra station. Station -> hotel: ~23 km, ~30 min by car or taxi (OSRM).
#   Szklarska Poręba Górna station is closer (~1-2 km), but that day Kraków, Gdańsk and Katowice have no
#   connection to it with at most one change, so the times are to Jelenia Góra.
