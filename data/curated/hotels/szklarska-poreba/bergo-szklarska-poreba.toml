# Facts from the hotel's own website (bergohotel.pl; robots.txt allows the pages, checked by the find-hotels probe 2026-11-08):
# /hotel/dla-dzieci, /dzieci/kids-club, /dzieci/basen-dla-dzieci, /dzieci/animacje. Written in our words.
# Also on the site, no feature key for it: Game Room for children over 8 (9:00-23:00); a play corner with colouring books in the restaurant; water animations (games, aqua dance, swimming lessons); children up to 16 in the pool only with their guardians.
# Not stated (so not recorded yet): cot fee, Kids Club minimum age and whether a parent must stay, animation ages, pool depth / hours / temperature, playground, lift, parking.
#
# Coordinates: OpenStreetMap way/1085326475 centre ((c) OpenStreetMap contributors, ODbL).
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Jelenia Góra station. Station -> hotel: ~22 km, ~30 min by car or taxi (OSRM).
#   Szklarska Poręba Górna station is closer (~1-2 km), but that day Kraków, Gdańsk and Katowice have no
#   connection to it with at most one change, so the times are to Jelenia Góra.
