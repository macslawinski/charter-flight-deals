# /spa-bali-hai/baseny-i-sauny, the offer page "Rodzinny Relaks w Dolinie". Written in our words.
# Also on the site, no feature key for it: Zoo Charlotta, Fokarium, Kraina Bajek and Wodne Zoo Safari on the
# 120 ha grounds (summer); balance bike, scooter, thermometer, socket guards and anti-slip mat on request;
# children's cutlery, plates and disposable bibs in the restaurant; the hotel advises ordering baby items before
# arrival. Last pool hour (20:00-21:00) is adults only.
# Not stated (so not recorded yet): cot and other item fees, toddler food, playroom hours and minimum age,
# brodzik depth and temperature, lift, beach (the sea is ~10 km away; lakes on site).
#
# Coordinates: the hotel's own map link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Słupsk station. Station -> hotel: ~11 km, ~15 min by car or taxi (OSRM).
