# on /pakiet/rodzinne-wakacje-w-ciechocinku. Written in our words.
# Also on the site, no feature key for it: rental of pool toys and swimming aids for children at the Saltaris
# SPA pool; kids' SPA treatments and a "Mama i Dziecko" ritual; bike rental with equipment for children.
# In the "Rodzinne wakacje w Ciechocinku" package: one child up to 12 free (package only, not recorded).
