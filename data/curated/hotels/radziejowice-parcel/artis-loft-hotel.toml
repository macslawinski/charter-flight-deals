# Facts from the hotel's own website (artis-loft.pl; robots.txt allows all, checked 2026-11-08):
# /dzieci, /hotel/informator-hotelowy, /kontakt. Written in our words.
# Also on the site, no feature key for it: free child seats for rented bikes; outdoor pool in summer
# (no paddling pool mentioned); weekend packages with transport to Suntago.
# Not stated (so not recorded yet): lift, playroom hours / minimum age / supervision, animations,
# paddling pool, fee for children aged 3 (the site says free to 3, discounted "powyżej 4 lat").
#
# Coordinates: OpenStreetMap way/698933208 (ODbL); the site's own map embed points to Suntago, not the hotel.
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet.
