# Facts from the hotel's own website (grandhotel.tiffi.com; robots.txt allows all, checked 2026-11-08):
# /faq/, /atrakcje/, /tiffilandia/, /spa/, Regulamin GHT 2024 (PDF). Written in our words.
# Also on the site, no feature key for it: sledges in winter; Tiffilandia for non-guests 100 zł per child. The
# hotel is on the shore of Lake Jeziorak (no beach stated). Train to Iława: about 1 h from Gdańsk, 1 h 40 min from
# Warszawa (FAQ).
# Not stated (so not recorded yet): cot fee, free-stay age, baby bath, high chair, changing table, potty, bottle
# warmer, baby monitor, playroom ages/hours/supervision, brodzik rules, lift, parking fee.
#
