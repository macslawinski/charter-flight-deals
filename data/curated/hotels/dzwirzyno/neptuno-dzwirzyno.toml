# Facts from the hotel's own website (neptuno.pl; robots.txt allows all, checked 2026-11-07):
# /wakacje-nad-morzem-z-dzieckiem, /kontakt/Q&A, /ceny-i-pakiety, /spa/spa&wellness, home page,
# Regulamin Neptuno Resort (PDF). Written in our words.
# Also on the site, no feature key for it: welcome kit with an electric kettle for preparing toddler meals;
# children's circus shows once a week in July-August (free); children under 12 must stay under constant adult
# care (regulamin); bathroom steps on request; the home page says "100 m od morza", the Q&A says 150 m.
# Not stated (so not recorded yet): free-stay age, cot fee, high chair, pool or brodzik, playroom minimum
# age, animation ages, lift, parking fee.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Kołobrzeg station (times reused from Saltic Grzybowo, same station). Station -> hotel: ~12 km,
#   ~15 min by car or taxi (OSRM); no hotel transfer stated.
