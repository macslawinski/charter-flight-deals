# Facts from the hotel's own website (havethotel.pl; robots.txt allows all, checked 2026-11-07):
# /dla-dzieci, /regulaminy (hotel and parking rules, inline), /kontakt, home page. Written in our words.
# Also on the site, no feature key for it: socket covers and anti-slip mats; Kids Club Akwarium is 200 m2
# (climbing wall, ball pool, foam blocks, XBOX room); creative workshops adjusted to age.
# Not stated (so not recorded yet): cot fee (a cot exists: the free stay ends if the child uses one),
# baby bath, high chair, playroom hours and minimum age, whether the brodzik is indoor/heated, lift,
# parking fee amount, toddler food.
#
# Coordinates: the hotel's own "Sprawdź dojazd" Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Kołobrzeg station (times reused from Saltic Grzybowo, same station). Station -> hotel:
#   ~12 km, ~15 min by car (OSRM); the hotel's door-to-door transfer from Kołobrzeg costs 150 zł (up to 4 people).
slug = "havet-dzwirzyno"
place = "dzwirzyno"
name = "HAVET Hotel Resort & Spa"
official_url = "https://www.havethotel.pl/"
address = "ul. Wyzwolenia 29, 78-131 Dźwirzyno"
