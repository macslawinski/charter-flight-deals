# Facts from the hotel's own website (gorzelanny.pl/hotel-dzwirzyno; robots.txt disallows only /wp-admin/,
# checked 2026-11-07): /dla-dzieci/, /spa/, home page, Regulamin pobytu (PDF). Written in our words.
# Also on the site, no feature key for it: 100 m from Lake Resko; indoor pool 12 x 6 m with a water slide and two
# jacuzzis, outdoor pool open in the summer holidays; beach carts for rent; children 4-12 pay 50% of the adult price.
# Not stated (so not recorded yet): baby bath, bottle warmer, changing table, potty, brodzik, playroom hours and
# minimum age, animation ages, lift, outdoor playground, toddler food.
#
# Coordinates: OpenStreetMap way/1303545551 (ODbL); the hotel's site has no map link with coordinates.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Kołobrzeg station (times reused from Saltic Grzybowo, same station). Station -> hotel: ~15 km,
#   ~20 min by car or taxi (OSRM); no hotel transfer stated.
