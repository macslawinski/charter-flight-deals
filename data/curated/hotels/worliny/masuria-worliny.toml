# Facts from the hotel's own website (hotelmasuria.pl; robots.txt allows all but WooCommerce/admin paths,
# checked 2026-11-08): /dla-dzieci/, /dla-najmlodszych/, /pokoje/, /kontakt/, the PDF regulations of the pool and
# the play room. Written in our words.
# Also on the site, no feature key for it: family rooms with a sofa bed; extra beds possible; baby items for the
# room and bathroom "on request" without a list; workshops (art, dance, cooking) with animators. Pool rules:
# children under 16 only with an adult (arm's reach), under 3 only in swim nappies; pool 9:00-21:00.
# The lead's note that a cot cannot be added in some rooms is no longer on the site.
# Not stated (so not recorded yet): cot, free-stay age, baby bath, changing table, potty, bottle warmer, baby
# monitor, lift, parking, beach.
#
# Coordinates: OpenStreetMap node/1061552164 ((c) OpenStreetMap contributors, ODbL).
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet (nearest station Olsztyn / Ostróda).
