# Facts from the hotel's own website (lasiesta.pl; robots.txt allows the pages used, checked 2026-11-07):
# /hotel-przyjazny-rodzinie, /warunki-rezerwacji, home page. Written in our words.
# Also on the site, no feature key for it: virtual games corner (Xbox, Kinect) in the playroom; sandpit,
# trampoline and garden swing outside; brine pool 40 m², 1.35 m deep (no brodzik); children under 10 get a
# discount when staying with two full-paying adults; games and animator activities in many packages.
# Not stated (so not recorded yet): toddler food, potty, playroom hours and minimum age, animation outside
# packages, lift, parking fee.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Władysławowo station. Station -> hotel: ~8 km, ~10 min by car or taxi (OSRM).
