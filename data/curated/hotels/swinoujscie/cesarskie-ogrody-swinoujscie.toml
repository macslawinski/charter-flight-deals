# Facts from the hotel's own website (cesarskieogrody.pl; robots.txt allows all, checked 2026-11-07):
# /inspiracje/dla-dzieci, /hotel/faq, /spa-wellness/basen, home page. Written in our words.
# Also on the site, no feature key for it: hotel guests use both pool zones free during opening hours;
# minors need ID and proof of relationship at check-in.
# Not stated (so not recorded yet): free-stay age, cot fee, baby bath, changing table, potty, high chair,
# brodzik, playroom hours and age, animations, lift, toddler food.
# Fewer than 8 verified facts: the site says little more for 0-3.
#
# Coordinates: OpenStreetMap node/1668472169 (ODbL); the hotel's own map link is a short link without
# coordinates.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Świnoujście (main PKP) station. Station -> hotel: ~3 km, ~5 min by car or taxi (OSRM).
#   The hotel FAQ names the Świnoujście Centrum stop 5 minutes on foot, but from the six cities it needs
#   2-3 changes, so it is not used here.
