# Facts from the hotel's own website (granohotels.pl; robots.txt allows all, checked 2026-11-07):
# /grano-life-gdansk/dzieci, hotel rules PDF (Regulamin Grano Life Gdańsk). Written in our words.
# Chain domain: only pages under /grano-life-gdansk/ and its own rules PDF were used.
# Also on the site, no feature key for it: game room (PlayStation, board games, 08:00-20:00); pizza workshops for
# children on Saturdays 13:00-14:00 (sign up at reception); SPA treatments for children; armbands and swim
# nappies for sale; children under 10 use the pool free, under 16 only with an adult (pool rules in the PDF).
# Several offers are called "DZIECI GRATIS", but no standing free-stay rule is published.
# Not stated (so not recorded yet): free-stay age, fees for baby items, toddler food, playroom minimum age,
# brodzik, lift, parking fee, beach distance.
#
# Coordinates: OpenStreetMap way/769255173 (ODbL; still named "Number One by Grano" in OSM, same address).
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Gdańsk Główny. Station -> hotel: ~2 km, ~5 min by car (OSRM) or a walk.
