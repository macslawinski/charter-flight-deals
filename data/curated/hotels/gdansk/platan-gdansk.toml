# Facts from the hotel's own website (hotelplatan.gda.pl; robots.txt allows all but WordPress admin paths,
# checked 2026-11-07): /dla-dzieci/. Written in our words.
# Also on the site, no feature key for it: kettle, extra towel, electronic thermometer and socket guards on
# request; children 7-10 can have an extra bed in selected rooms for a fee. The hotel is in the south of Gdańsk;
# the site points to Tricity beaches as a trip (no distance).
# Not stated (so not recorded yet): fees for baby items, changing table, toddler food, playroom hours and
# minimum age, animations, pool or brodzik, lift, parking fee.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Gdańsk Główny. Station -> hotel: ~8 km, ~10 min by car or taxi (OSRM).
