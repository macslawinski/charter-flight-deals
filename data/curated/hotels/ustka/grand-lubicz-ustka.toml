# water animations; recreational pool with a slide and lazy river.
# Not stated (so not recorded yet): free-stay age, high chair, toddler food, animation ages, brodzik depth and
# temperature, beach distance.
#
# Coordinates: OpenStreetMap way/272001745 (ODbL); the hotel's map links are short links without coordinates.
