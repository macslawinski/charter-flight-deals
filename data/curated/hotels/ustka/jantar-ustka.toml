# Facts from the hotel's own website (jantar-ustka.pl; robots.txt allows all, checked 2026-11-07):
# /faq/, /oferta-dla-rodzin/, /regulaminy/. Written in our words.
# Also on the site, no feature key for it: children's bikes and bike seats; in the family offer (minimum
# 5 nights) a free soup 13:00-14:00 for children under 14 and a "Kids Zone".
# Not stated (so not recorded yet): cot fee, high chair, kids menu, toddler food, baby bath, bottle warmer,
# changing table, potty, playroom hours and minimum age, animation ages, brodzik depth and temperature, beach
# distance in metres (the family page says "a few steps").
#
# Coordinates: OpenStreetMap relation/19560310 via Nominatim (ODbL), matching the address.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Ustka station. Station -> hotel: ~2 km, ~5 min by car or taxi (OSRM).
