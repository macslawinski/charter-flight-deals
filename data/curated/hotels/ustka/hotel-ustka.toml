# Facts from the hotel's own website (hotel-ustka.eu; robots.txt allows all, checked 2026-11-07):
# /atrakcje-hotel, /regulamin, home page. Written in our words.
# Also on the site, no feature key for it: the attractions page mentions a free stay for little ones under 2 and
# discounts for children under 10, without saying whether this is a standing rule or an offer (not recorded);
# the price list mentions children's equipment for hire without details; benches for parents by the playground.
# Not stated (so not recorded yet): cot, high chair, baby bath, bottle warmer, changing table, potty, kids menu
# outside the season, playroom hours and minimum age, pool or brodzik, lift, parking fee for hotel guests.
# Fewer than 8 verified facts: the site says little about baby equipment.
#
# Coordinates: OpenStreetMap way/434636081 (ODbL); the hotel's map link is a short link without coordinates.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Ustka station. Station -> hotel: ~2 km, ~5 min by car or taxi (OSRM).
