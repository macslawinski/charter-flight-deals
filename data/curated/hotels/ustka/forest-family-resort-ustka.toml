# Facts from the hotel's own website (forestustka.pl; robots.txt allows all but /wp-admin/, checked 2026-11-07):
# /dla-dzieci/, /kontakt/. Written in our words.
# Also on the site, no feature key for it: Sala Montessori for the youngest (themed play houses, a mini monkey
# grove, Duplo); giant sandpits with a mini playground on the resort's private dune; a big playground with a
# zip line.
# Not stated (so not recorded yet): free-stay age, cot, high chair, baby bath, bottle warmer, changing table,
# potty, kids menu, toddler food, Funlandia hours and minimum age, animation ages, pool or brodzik, lift, parking.
# Fewer than 8 verified facts: the site describes play areas but no baby equipment.
#
# Coordinates: OpenStreetMap node/2977772835 (ODbL).
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Ustka station. Station -> hotel: ~1 km, ~5 min by car (OSRM) or a short walk.
slug = "forest-family-resort-ustka"
place = "ustka"
name = "Forest Family Resort"
official_url = "https://forestustka.pl/"
address = "ul. Kościuszki 19, 76-270 Ustka"
lat = 54.5870712  # OpenStreetMap node/2977772835, ODbL
lon = 16.8695759
status = "published"

[[feature]]
key = "playroom"
value = { available = true, free = true }
short = "Funlandia i sala Montessori, bezpłatnie"
note = "Kryta sala zabaw Funlandia (małpi gaj z basenem z kulkami, zjeżdżalnią, tunelami i trampoliną), bez limitu i bezpłatnie dla gości; obok sala Montessori dla maluchów. Godzin, minimalnego wieku i zasad opieki strona nie podaje."
source = "hotel_website"
url = "https://forestustka.pl/dla-dzieci/"
verified_at = 2026-11-07

