# Facts from the hotel's own website (hotel-lubicz.pl; robots.txt allows all, checked 2026-11-07):
# /hotel/hotel-przyjazny-rodzinie, home page. Written in our words. The hotel asks to request room equipment
# when booking. Its informator hotelowy PDF is a scan without text, not used.
# Also on the site, no feature key for it: toys and colouring books in the restaurant while waiting for meals;
# swimming lessons and aqua aerobics (the pool itself is not described).
# Not stated (so not recorded yet): free-stay age, fees for any baby item, kids menu, toddler food, potty,
# playroom hours and minimum age, animations, brodzik, lift, beach distance, parking.
#
# Coordinates: OpenStreetMap way/271142612 (ODbL); the hotel's map link is a short link without coordinates.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Ustka station. Station -> hotel: ~1 km, ~5 min by car (OSRM) or a short walk.
