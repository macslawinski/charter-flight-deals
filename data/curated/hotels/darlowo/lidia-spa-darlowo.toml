# Facts from the hotel's own website (hotel-lidia.pl; robots.txt allows all, checked 2026-11-07):
# /dzieci (list + FAQ), /hotel-info, /regulamin with its PDFs (Regulamin basenu 2026, Regulamin sali
# zabaw 2019, Regulamin parkingu monitorowanego). Written in our words.
# Also on the site, no feature key for it: extra bed for a child 3-12 is 120-160 zł/night with breakfast
# and dinner; children under 3 may use the pool only in swim nappies; pool open daily 9:00-22:00, free;
# a warm soup for children up to 12 at lunch (13:00-14:00) in winter and summer holidays.
# Not stated (so not recorded yet): lift, whether the brodzik is heated, toddler food, stroller rental,
# parking fee (only "according to the price list").
#
# Coordinates: the hotel's own Google Maps link on /dzieci.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not recorded. Nearest station with regular trains is Sławno, ~26 km / ~30 min by car (OSRM);
#   Darłowo has no regular passenger trains and the hotel runs no transfer.
