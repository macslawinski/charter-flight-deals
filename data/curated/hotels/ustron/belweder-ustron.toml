# Facts from the hotel's own website (hotelbelweder.pl; robots.txt has no Disallow, checked 2026-11-08):
# /hotel-dla-rodzin (incl. its FAQ), /regulaminy and the playroom rules PDF
# (wa-uploads.profitroom.com/belwederhotel/..._Regulaminpokojuzabaw.pdf). Written in our words.
# Also on the site, no feature key for it: Aqua Kids pool classes; connecting rooms (two double rooms with an
# inner lockable door, up to 4 people) and family rooms with extra beds; guests under 5 are welcome at the
# attractions with a guardian (FAQ). The pool rules PDF has no extractable text (not read).
# Not stated (so not recorded yet): cot fee, free-stay age, baby bath, high chair, changing table, potty,
# bottle warmer, baby monitor, lift, brodzik depth and temperature, parking (the parking rules are listed
# without a link).
#
# Coordinates: OpenStreetMap node/5396902548 ((c) OpenStreetMap contributors, ODbL); the site gives no map
# coordinates.
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet (Ustroń, regional trains only).
