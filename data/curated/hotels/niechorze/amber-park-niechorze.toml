# Facts from the hotel's own website (amber-park.pl; robots.txt allows all, checked 2026-11-07):
# /hotel/dla-dzieci, /hotel/najczestsze-pytania (FAQ), Regulamin Zatoki Zabaw (PDF), home page.
# Written in our words.
# Also on the site, no feature key for it: outdoor heated pool 120 cm deep; spa zone 10:00-23:00; "2 dzieci
# gratis" and free-parking only in dated packages (not recorded as rules); family rooms from 320 zł/night.
# Not stated (so not recorded yet): cot, free-stay age, baby bath, bottle warmer, changing table, potty,
# high chair, kids menu, playroom hours and minimum age, lift, parking fee (price list at reception).
# Fewer than 8 verified facts: the site says little more for 0-3.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Trzebiatów station. Station -> hotel: ~19 km, ~20 min by car or taxi (OSRM); no hotel transfer.
slug = "amber-park-niechorze"
place = "niechorze"
name = "Amber Park Spa"
official_url = "https://www.amber-park.pl/"
address = "ul. Zaciszna 8, 72-350 Niechorze"
lat = 54.089829  # the hotel's own Google Maps link
lon = 15.056328
status = "published"

