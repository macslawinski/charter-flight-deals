# Facts from the hotel's own website (hotel-amber.pl; robots.txt allows all, checked 2026-11-08):
# /pokoje/pokoj-rodzinny-amber (Hotel Amber's family room), /hotel/pobyt-z-dzieckiem. Written in our words.
# The domain covers Amber Boutique Hotels (Hotel Amber and Amber Design); only facts from Hotel Amber's own
# room page are recorded.
# Also on the site, no feature key for it (group page "pobyt z dzieckiem", not tied to one hotel): non-slip
# shower mat, board games and puzzles, children under 12 at 25% off; extra charges are paid at the hotel.
# The hotel regulamin PDF linked from the room page returns 404 (unread).
# Not stated (so not recorded yet): baby bath, kids' menu, changing table, potty, baby monitor, playroom,
# parking fee (only a "Pobyt + Parking" package).
#
# Coordinates: the site's map link (50.0655403, 19.9337578); OpenStreetMap way/139442261 agrees.
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet (Kraków Główny).
