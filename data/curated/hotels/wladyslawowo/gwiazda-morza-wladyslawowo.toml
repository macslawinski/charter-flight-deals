# Facts from the hotel's own website (gwiazdamorza.com; robots.txt allows all, checked 2026-11-07):
# /dla-dzieci (JavaScript page, read in Chrome). Written in our words.
# Also on the site, no feature key for it: children 5-14 pay 50% of the adult price for meals; corner and socket
# guards and children's bathrobes; SPA treatments for babies and children (baby massage); family sauna sessions;
# mini climbing wall in the playroom; family rooms and apartments with kitchenettes; animation plan for
# 01.09-30.11.2026 (Mon, Tue, Thu, Fri from 13:00, Sat from 11:00).
# Not stated (so not recorded yet): fees for baby items, changing table, toddler food, playroom hours and minimum
# age, animation ages, brodzik depth and temperature, lift, parking, beach distance in metres.
#
# Coordinates: OpenStreetMap way/166342506 via Nominatim (ODbL); the hotel's map links are short links.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Władysławowo station. Station -> hotel: ~1 km, ~5 min by car or taxi (OSRM) or a short walk.
