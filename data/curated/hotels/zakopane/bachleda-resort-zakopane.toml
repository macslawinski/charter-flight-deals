# home page. Written in our words. The resort has two buildings, Bachleda Residence and Hotel Wersal; the note
# says when the site ties a fact to one of them.
# Also on the site, no feature key for it: Spa & Wellness with a pool, jacuzzi and saunas, 8:00-22:00; under 13
