# Facts from the hotel's own website (hotelmaria-szczawnica.pl; robots.txt allows all, checked 2026-11-08):
# home page (incl. its FAQ), /spa-and-wellness, /regulamin, /kontakt. Written in our words.
# Also on the site, no feature key for it: children in the SPA & Wellness area must be under adult supervision;
# hotel guests use the SPA free of charge by booking a time.
# Not stated (so not recorded yet): cot, free-stay age, baby bath, high chair, kids' menu, changing table,
# potty, bottle warmer, baby monitor, lift, playroom age and hours, brodzik depth.
#
# Coordinates: OpenStreetMap way/326766136 (centre; (c) OpenStreetMap contributors, ODbL); the site gives no
# map coordinates.
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: none sensible (no railway station in Szczawnica); car only.
slug = "maria-szczawnica"
place = "szczawnica"
name = "Hotel Maria"
official_url = "https://www.hotelmaria-szczawnica.pl/"
address = "Park Dolny 10, 34-460 Szczawnica"
lat = 49.4282368
lon = 20.4774711
status = "published"

[[feature]]
key = "playroom"
value = { available = true }
short = "Bawialnia"
note = "Na najmłodszych czeka nowocześnie, oryginalnie wyposażona bawialnia. Minimalnego wieku, godzin ani tego, czy rodzic musi zostać, strona nie podaje."
source = "hotel_website"
url = "https://www.hotelmaria-szczawnica.pl/"
verified_at = 2026-11-08

[[feature]]
key = "paddling_pool"
value = { available = true }
short = "Brodzik z atrakcjami w strefie Wellness"
note = "W strefie Wellness brodzik dla dzieci z atrakcjami; dzieci pod opieką dorosłych. Głębokości ani temperatury strona nie podaje."
source = "hotel_website"
url = "https://www.hotelmaria-szczawnica.pl/spa-and-wellness"
verified_at = 2026-11-08

[[feature]]
key = "parking"
value = { free = true, monitored = true }
short = "Bezpłatny parking monitorowany"
note = "Przy hotelu monitorowany, darmowy parking dla gości (FAQ na stronie głównej)."
source = "hotel_website"
url = "https://www.hotelmaria-szczawnica.pl/"
verified_at = 2026-11-08

