# Facts from the hotel's own website (hotelriverstyle.pl; robots.txt allows all, checked 2026-11-07):
# /dla-dzieci, /dla-dzieci/baseny, hotel rules PDF (Regulamin 2024). Written in our words.
# Also on the site, no feature key for it: a shop at the pool with children's accessories; birthday parties in
# the playroom.
# Not stated (so not recorded yet): free-stay age, cot, high chair, baby bath, bottle warmer, changing table,
# potty, kids menu, toddler food, playroom hours and minimum age, animations, lift.
# Fewer than 8 verified facts: nothing about baby equipment on the site.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Reda station. Station -> hotel: ~2 km, ~5 min by car or taxi (OSRM).
slug = "river-style-reda"
place = "reda"
name = "River Style Hotel & SPA"
official_url = "https://www.hotelriverstyle.pl/"
address = "ul. Pucka 10B, 84-240 Reda"
lat = 54.6085854  # the hotel's own Google Maps link
lon = 18.3496666
status = "published"

[[feature]]
key = "playroom"
value = { available = true }
short = "Sala zabaw Riverlandia"
note = "Sala zabaw Riverlandia dla najmłodszych. Godzin, minimalnego wieku i zasad opieki strona nie podaje; regulamin: dzieci do 10 lat pod opieką dorosłych."
source = "hotel_website"
url = "https://www.hotelriverstyle.pl/dla-dzieci"
verified_at = 2026-11-07

[[feature]]
key = "playground"
value = { available = true, outdoor = true }
short = "Na zewnątrz"
note = "Zewnętrzny plac zabaw."
source = "hotel_website"
url = "https://www.hotelriverstyle.pl/dla-dzieci"
verified_at = 2026-11-07

[[feature]]
key = "paddling_pool"
value = { indoor = true, heated = true, count = 2, depth_cm = [30, 50], water_temp_c = 32 }
short = "Dwa brodziki 30 i 50 cm, 31,5–32°C"
note = "Dwa brodziki dla najmłodszych: 30 cm i 50 cm głębokości, z grzybkiem wodnym; woda 31,5–32°C."
source = "hotel_website"
url = "https://www.hotelriverstyle.pl/dla-dzieci/baseny"
verified_at = 2026-11-07

[[feature]]
key = "parking"
value = { free = true, monitored = true }
short = "Bezpłatny, monitorowany"
note = "Bezpłatny monitorowany parking hotelowy (regulamin)."
source = "hotel_website"
url = "https://u.profitroom.com/2020-hotelriverstyle-pl/uploads/RegulaminHotelRiverStyleSpa2024_2.pdf"
verified_at = 2026-11-07

