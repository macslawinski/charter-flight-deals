# Facts from the hotel's own website (mercureszczyrk.pl; robots.txt disallows only /stats/, checked
# 2026-11-08): /hotel-dla-dzieci-w-gorach, /baseny-szczyrk, home page, hotel rules PDF
# (/wp-content/uploads/REGULAMIN-.pdf, s. 7) and parking rules PDF
# (/wp-content/uploads/Regulamin-korzystania-z-parkingu-MSR.pdf). Written in our words.
# Also on the site, no feature key for it: Water & Fun pool zone open 8:00-22:00 (whether included for hotel
# guests isn't stated); Hot & Chill zone from 16 years, extra charge.
# Not stated (so not recorded yet): free-stay age, baby bath, changing table, potty, bottle warmer, baby
# monitor, kids' menu, lift, playroom ages and hours, animations, brodzik depth and temperature, parking fee.
#
# Coordinates: OpenStreetMap relation/3283453 (centre; (c) OpenStreetMap contributors, ODbL); the site gives
# no map coordinates.
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet (Szczyrk has no station; Bielsko-Biała about 20 km).
