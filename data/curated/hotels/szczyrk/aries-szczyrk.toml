# Facts from the hotel's own website (ariesszczyrk.pl; robots.txt blocks only old pages and booking-engine
# copies, checked 2026-11-08): /dzieci-w-aries (incl. its FAQ), /regulaminy and the PDFs linked there
# (hotel rules, playroom rules, Aqua Aries rules, Aqua Aries kids' play zone rules, parking rules).
# Written in our words.
# Also on the site, no feature key for it: family suites for 5 people; Aries SPA rituals for kids;
# inflatable play zone in Aqua Aries for children 3-12 with a parent; Aqua Aries: children under 13 only with
# an adult (one adult per five children).
# Not stated (so not recorded yet): cot and bath fees, free-stay age, high chair, changing table, potty,
# bottle warmer, baby monitor, lift, animation ages and hours, brodzik depth and temperature, whether Aqua
# Aries is included for hotel guests, parking rate.
#
# Coordinates: OpenStreetMap node/11574541859 ((c) OpenStreetMap contributors, ODbL); the site gives no map
# coordinates.
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet (Szczyrk has no station; Bielsko-Biała about 20 km).
