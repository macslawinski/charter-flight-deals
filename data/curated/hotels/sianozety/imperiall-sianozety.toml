# Facts from the hotel's own website (imperiall.pl; robots.txt allows all, checked 2026-11-07):
# /dla-dzieci, /atrakcje-basen, /pokoje-apartament-domki, /regulamin, home page. Written in our words.
# Also on the site, no feature key for it: Tropicoland playroom (summer only, extra fee); lifeguard at both pools;
# children under 12 must be under constant care (regulamin §6); day pool tickets for non-guests free for 0-2.
# Not stated (so not recorded yet): baby bath, bottle warmer, changing table, potty, high chair, toddler food,
# Joonglaland hours and minimum age (its own rules are an annex not on the site), animation ages, lift.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Ustronie Morskie station (times reused from Hotel Wodnik, same station). Station -> hotel:
#   ~3 km, ~5 min by car or taxi (OSRM).
