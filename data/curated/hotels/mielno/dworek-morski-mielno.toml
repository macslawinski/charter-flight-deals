# Facts from the hotel's own website (dworekmorski.pl; robots.txt allows the pages used, checked 2026-11-07):
# /wczasy-dla-rodzin/, /hotel-z-basenem/ (with FAQ), home page FAQ. Written in our words.
# The site calls the place both "hotel" and "pensjonat"; it has rooms and apartments, an indoor pool and SPA,
# and OpenStreetMap tags it as a 4-star hotel, so it is kept under the hotels-only rule.
# Also on the site, no feature key for it: the rooms are big enough for a travel cot; Lake Jamno right next to it;
# rooms adapted for guests with reduced mobility.
# Not stated (so not recorded yet): free-stay age, cot fee, baby bath, bottle warmer, changing table, potty,
# animations, playroom hours and age, brodzik depth and temperature.
#
# Coordinates: OpenStreetMap node/10711674121 (ODbL). Address: the site gives none; street from OpenStreetMap
# (Nominatim reverse geocoding), no house number.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Koszalin station (times reused from Unitral Mielno, same station). Station -> hotel: ~14 km,
#   ~20 min by car or taxi (OSRM).
slug = "dworek-morski-mielno"
place = "mielno"
name = "Dworek Morski SPA & Wellness"
official_url = "https://dworekmorski.pl/"
address = "ul. Bolesława Chrobrego, 76-032 Mielno"
lat = 54.2604914  # OpenStreetMap node/10711674121, ODbL
lon = 16.0649192
status = "draft"

