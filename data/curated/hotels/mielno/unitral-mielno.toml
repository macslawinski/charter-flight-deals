# Facts from the hotel's own website (unitral.pl; robots.txt allows all, checked 2026-11-07):
# /dzieci (list + FAQ), /hotel-info, /regulamin. Written in our words.
# Also on the site, no feature key for it: family SPA mornings (saunas and brine pool for families with
# children at set hours, children up to 15 free with an adult); Kids SPA (ages given inconsistently:
# "do 15 lat" vs "4-16 lat"); a nurse's room; family rooms and family studios; house rules: children
# may not be left without an adult anywhere in the hotel.
# Not stated (so not recorded yet): cot fee amount, free-stay age for small children, playroom hours
# and minimum age, whether the brodzik is indoor/heated, lift, parking fee, toddler food (meals adapted
# to individual dietary needs on request).
#
# Coordinates: the hotel's own Google Maps link on /dzieci.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most
#   one change, to Koszalin station. Station -> hotel: ~13 km, ~20 min by car or taxi (OSRM); the hotel
#   runs no transfer (not mentioned on the site).
