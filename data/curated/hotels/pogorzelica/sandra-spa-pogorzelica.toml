# Facts from the hotel's own website (sandraspa.pl; robots.txt allows all, checked 2026-11-07):
# /dzieci, /dzieci/atrakcje-i-udogodnienia, /dzieci/sale-zabaw, /dzieci/aquapark-dla-dzieci, home page.
# Written in our words.
# Also on the site, no feature key for it: bowling, Game Room and interactive play room; swimming lessons;
# "2 dzieci gratis" (one under 3 sleeping with parents, one under 14 on an extra bed) only in offers for selected
# rooms (not recorded as a rule).
# Not stated (so not recorded yet): cot, baby bath, bottle warmer, changing table, potty, high chair, kids menu,
# playroom hours, minimum age and whether a parent must stay, animation ages, brodzik depth, lift, beach distance,
# parking.
# Fewer than 8 verified facts: the site says little more for 0-3.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Trzebiatów station (times reused from Amber Park Niechorze, same station). Station -> hotel:
#   ~18 km, ~20 min by car or taxi (OSRM); no hotel transfer stated.
