# Facts from the hotel's own website (ostaniec.com.pl; robots.txt allows all, checked 2026-11-08):
# /hotel-dla-dzieci, /hotel/regulamin-hotelu. Written in our words.
# Also on the site, no feature key for it: rope park with two routes for children from 6 years or 140 cm;
# the Osada Zborów water park next door (not the hotel) has a 30 cm toddler pool, summer season only; hotel
# rules: children under 12 under constant supervision of their guardians. Also on the site: "Ferie zimowe na
# Jurze - pobyt dzieci gratis" package (ages not given), not recorded as a hotel rule.
# Not stated (so not recorded yet): cot fee, free-stay age, changing table, potty, baby monitor, lift,
# playroom age and hours, parking.
#
# Coordinates: OpenStreetMap way/152948569 (centre; (c) OpenStreetMap contributors, ODbL); the site gives no
# map coordinates.
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet (Zawiercie about 25 km).
