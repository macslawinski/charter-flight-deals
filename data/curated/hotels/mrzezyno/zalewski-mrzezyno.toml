# Facts from the hotel's own website (hotelzalewski.pl; robots.txt allows all, checked 2026-11-07):
# /hotel/dla-dzieci, /aquapark-zjezdzalnie-sauny-laznie, Regulamin hotelu (PDF). Written in our words.
# Also on the site, no feature key for it: bowling with bumpers for small children; arcade corner; children under
# 13 must be under constant adult care (regulamin, s. 3); "pobyt dziecka gratis" only in dated offers (not
# recorded); the parking regulations are an image only.
# Not stated (so not recorded yet): cot, free-stay age, baby bath, bottle warmer, changing table, potty, high
# chair, kids menu, playroom hours and age, animations, brodzik depth and temperature, lift, beach distance,
# parking fee.
# Fewer than 8 verified facts: the site says little more for 0-3.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Trzebiatów station (times reused from Amber Park Niechorze, same station). Station -> hotel:
#   ~12 km, ~15 min by car or taxi (OSRM); no hotel transfer stated.
