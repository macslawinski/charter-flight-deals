# Facts from the hotel's own website (wichrowe.info; robots.txt allows the pages used, checked 2026-11-07):
# /dla-dzieci/, /o-nas, home page. Written in our words.
# Also on the site, no feature key for it: big garden for games and sports; water equipment rental at the lake;
# seasonal film screenings; horse-drawn carriage rides. Resort & Spa on Lake Kłodno with hotel rooms, restaurant
# and wellness (pool, saunas, jacuzzi).
# Not stated (so not recorded yet): free-stay age, cot, high chair, baby bath, bottle warmer, changing table,
# potty, kids menu, toddler food, playroom hours and minimum age, brodzik depth and temperature, lift, parking.
