# Facts from the hotel's own website (hotel-faltom.com.pl; robots.txt allows all, checked 2026-11-07):
# /hoteldladzieci, /faq, /animacje_dla_dzieci, Klub Malucha rules (PDF). Written in our words.
# Also on the site, no feature key for it: shared kitchenette for parents of small children next to Klub Malucha
# (room 128, microwave, kettle, disposable cutlery, 06:00-23:00); socket and drawer guards and an anti-slip
# step on request; swim nappies sold at the pool reception; outdoor water playground with warm water (seasonal);
# extra bed for a child under 12: 80 zł per night with breakfast.
# Not stated (so not recorded yet): bottle warmer, potty, toddler food, animation ages, brodzik temperature, lift,
# beach distance (Rumia is not on the beach).
#
# Coordinates: OpenStreetMap node/5421282803 (ODbL).
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Rumia station. Station -> hotel: ~1 km, ~5 min by car (OSRM) or a short walk.
