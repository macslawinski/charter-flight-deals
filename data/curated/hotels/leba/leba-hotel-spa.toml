# Facts from the hotel's own website (hotelleba.com.pl; robots.txt allows all, checked 2026-11-07):
# /hotel/hotel-dzieciom, /basen-i-spa, /regulamin-leba-hotel-spa, home page. Written in our words.
# Also on the site, no feature key for it: socket covers and a cordless kettle free on request; some rooms with
# window, drawer and wardrobe locks; Kids SPA offer; colouring corner in the restaurant. Hotel Nadmorski next door
# (ul. Nadmorska 9C) is a separate hotel with its own site.
# Not stated (so not recorded yet): cot, high chair, toddler food, Kids Klub hours and minimum age, animation ages,
# lift, parking.
#
# Coordinates: OpenStreetMap way/292291728 (ODbL).
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: none. rozklad-pkp.pl finds no trains to Łeba on Thursday 2026-11-12 (the station is not served that
#   day), and Lębork, the nearest served station, is ~28 km away.
