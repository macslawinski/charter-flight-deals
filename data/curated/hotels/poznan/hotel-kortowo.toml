# Facts from the hotel's own website (kortowo.com.pl; robots.txt allows the hotel pages, checked 2026-11-08):
# /hotel/dzieci/, /hotel/rezerwacje-cennik/, /hotel/dojazd/. Written in our words.
# Also on the site, no feature key for it: 50% of the stay price for children 6-12, full price over 12; extra bed
# 200 zł per night; breakfast 50 zł per person (no child rate stated); tennis courts; trams 5, 8, 14 from the
# railway and bus station towards Górczyn, then about 100 m from the bus stop of lines 610, 616 and 702.
# Not stated (so not recorded yet): cot fee, baby bath, bottle warmer, changing table, potty, indoor playroom,
# lift.
#
# Coordinates: OpenStreetMap way/378452537, ODbL (no map link with coordinates on the site).
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet (Poznań Główny).
