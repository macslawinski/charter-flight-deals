# Facts from the hotel's own website (laola.pl; robots.txt allows all, checked 2026-11-07):
# /dla-dzieci, /resort-spa-nad-morzem, family rooms page, /kontakt, home page. Written in our words.
# Also on the site, no feature key for it: children's tableware and cutlery; blankets for children to rent;
# pool complex 9:00-21:00, adults only from 20:00; airport transfers (Goleniów, Berlin) - the page still
# lists Berlin-Tegel, so it looks outdated and is not recorded as a fact; kids' birthday parties with an
# animator in the bowling club.
# Not stated (so not recorded yet): cot fee, bottle warmer, changing table, potty, brodzik (only ball pools
# in the playroom), playroom hours and minimum age, animations, lift, beach distance in metres.
#
# Coordinates: the hotel's own Google Maps link on the home page.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not recorded. Nearest station with regular trains is Gryfice, ~30 km (same as Linea Mare);
#   no hotel transfer from a station is stated.
