# Facts from the hotel's own website (blueandgreenhotels.pl/morze; robots.txt allows all, checked 2026-11-07):
# /morze/dzieci, /morze/spa/basen, /morze (home). Written in our words.
# Also on the site, no feature key for it: socket, furniture and window guards on request; pool 11 x 3 m,
# 135 cm deep, 29°C, ozone-treated (no brodzik); day pool tickets free for under-3s; "dzieci GRATIS" only in a
# winter-holiday offer without stated ages (not recorded). Baltic Plaza next door belongs to the same company.
# Not stated (so not recorded yet): free-stay rule, cot fee amount (price list not on the site), changing table,
# potty, toddler food, playroom hours and minimum age, animation ages, lift, parking fee.
#
# Coordinates: OpenStreetMap node/10175216689 (ODbL).
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Kołobrzeg station (times reused from Saltic Grzybowo, same station). Station -> hotel: ~4 km,
#   ~5 min by car or taxi (OSRM).
