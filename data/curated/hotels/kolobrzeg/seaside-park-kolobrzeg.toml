# Facts from the hotel's own website (seasidepark.pl; robots.txt allows all, checked 2026-11-07):
# /dla-dzieci, /hotel/qa (FAQ), home page. Written in our words.
# Also on the site, no feature key for it: "Pokój Małego Pirata" themed room; animators take no
# responsibility for the children (parents stay in charge); 25 m sports pool; pool Mon-Sat 10:00-22:00,
# Sun 8:00-20:00; every child, of any age, must be included in the booking.
# Not stated (so not recorded yet): free-stay age, cot fee, changing table, high chair, playroom minimum
# age, animation ages, lift, toddler food, outdoor playground.
#
# Coordinates: the hotel's own "Zobacz na mapie" Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Kołobrzeg station (times reused from Saltic Grzybowo, same station). Station -> hotel:
#   2.4 km (hotel FAQ), taxi.
