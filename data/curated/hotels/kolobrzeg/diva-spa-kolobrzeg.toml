# Facts from the hotel's own website (hoteldivaspa.pl; robots.txt allows all, checked 2026-11-07):
# /dla-rodziny/udogodnienia-dla-rodzin, /dla-rodziny/kids-club, /spa-wellness/basen-spa, home page.
# Written in our words. The hotel regulations PDF is a scan without a text layer, so it was not used.
# Also on the site, no feature key for it: "1 dziecko do 12 r.ż. gratis" only in a winter-holiday offer
# (not recorded as a rule).
# Not stated (so not recorded yet): free-stay rule outside offers, cot fee, baby bath, changing table,
# Kids Club hours, minimum age and whether a parent must stay, animation ages, brodzik depth, outdoor
# playground, lift, parking.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Kołobrzeg station (times reused from Saltic Grzybowo, same station). Station -> hotel: ~2 km,
#   ~5 min by car or taxi (OSRM).
