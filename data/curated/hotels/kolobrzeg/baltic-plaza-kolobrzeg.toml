# Facts from the hotel's own website (balticplaza.eu; robots.txt allows all, checked 2026-11-07):
# the "Rodzinne Ferie nad Bałtykiem" package page (OfferID=826182, no dates given), /spa-wellness/basen,
# /kontakt. Written in our words. The site has no permanent kids page: every fact below comes from that package
# description, which names this hotel (Baltic Plaza Medi SPA & Fit).
# Also on the site, no feature key for it: socket, furniture and window guards on request; pool 11 x 3 m,
# 135 cm deep, 29°C, ozone-treated (no brodzik); free stay 0-3 and daily animations only inside the package
# (not recorded as rules); Blue & Green Baltic next door belongs to the same company.
# Not stated (so not recorded yet): free-stay rule outside packages, cot fee amount, changing table, potty,
# playroom hours and age, beach distance (the sentence is cut off), lift, parking.
# Fewer than 8 verified facts: the site says little more for 0-3.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Kołobrzeg station (times reused from Saltic Grzybowo, same station). Station -> hotel: ~4 km,
#   ~5 min by car or taxi (OSRM).
