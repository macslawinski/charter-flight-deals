# Facts from the hotel's own website (aquariusspa.pl; robots.txt allows all, checked 2026-11-07):
# /hotel-aquarius-spa/dla-dzieci, /pl/hotel-dla-rodzin-z-dziecmi/udogodneinia-dla-dzieci-w-hotelu-aquarius-spa/,
# FAQ (/pl/najczesciej-zadawane-pytania-dotyczace-pobytu-w-hotelu/), Regulamin hotelowy (PDF). Written in our words.
# Also on the site, no feature key for it: playpen (kojec) in the pool changing room; footrest, air humidifier
# and bathroom step free on request; pool toys and lifeguards; games room and console room; no animations
# 29.11-03.12.2026 and 06.12-22.12.2026; prams must not be left in corridors (regulamin); beach carts for a fee.
# Not stated (so not recorded yet): free-stay age, high chair, potty, brodzik depth, Klub Zabaw hours and age
# (rules posted in the club), toddler food.
#
# Coordinates: OpenStreetMap node/1379289444 (ODbL); the hotel's map link is a short link without coordinates.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Kołobrzeg station (times reused from Saltic Grzybowo, same station). Station -> hotel: ~2 km,
#   ~5 min by car or taxi (OSRM).
