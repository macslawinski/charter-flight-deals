# Facts from the hotel's own website (hotelskipper.pl; robots.txt allows the pages used, checked 2026-11-07):
# /pokoje/pokoj-rodzinny/, hotel rules PDF (Regulamin Hotelowy 2022), home page. Written in our words.
# Also on the site, no feature key for it: a first-aid kit for little ones with a contactless thermometer;
# pool toys and noodles; dishes for children (linked menu). The Christmas 2026 family package repeats the
# baby items and adds Christmas animations.
# Not stated (so not recorded yet): high chair, bottle warmer, changing table, toddler food, playroom, regular
# animation programme, brodzik, lift, parking fee.
# Fewer than 8 verified facts.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Rumia station. Station -> hotel: ~14 km, ~20 min by car or taxi (OSRM).
slug = "skipper-rewa"
place = "rewa"
name = "Hotel Skipper"
official_url = "https://www.hotelskipper.pl/"
address = "ul. Sztormowa 2, Rewa"  # the site gives no postal code
lat = 54.6334891  # the hotel's own Google Maps link
lon = 18.5128921
status = "draft"

[[feature]]
key = "cot"
value = { available = true, paid = true, fee_pln_per_night = 20 }
short = "Z materacem, 20 zł za dobę"
note = "Łóżeczko z materacem, płatne 20 zł za dobę."
source = "hotel_website"
url = "https://www.hotelskipper.pl/pokoje/pokoj-rodzinny/"
verified_at = 2026-11-07

[[feature]]
