value = { free = true, sleeping_with_parents = true, max_children = 1, max_age_years = 6 }
short = "Pierwsze dziecko do 6 lat gratis"
note = "Pobyt bezpłatny dla dziecka do 6 lat śpiącego z rodzicami (pierwsze dziecko); za drugie dziecko 0–6 lat opłata jak za dostawkę dla 7–12 lat (regulamin hotelu)."
source = "hotel_website"
url = "https://www.hotelskipper.pl/wp-content/uploads/2022/04/Regulamin.Hotelowy-2022.pdf"
verified_at = 2026-11-07

