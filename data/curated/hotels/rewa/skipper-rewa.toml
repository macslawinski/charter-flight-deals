short = "Zabawy z animatorem do zorganizowania"
note = "Można zorganizować zabawy z animatorem; przy dobrej pogodzie warsztaty i animacje na plaży przy hotelu. Wieku i opłat strona nie podaje."
source = "hotel_website"
url = "https://www.hotelskipper.pl/pokoje/pokoj-rodzinny/"
verified_at = 2026-11-07

[[feature]]
