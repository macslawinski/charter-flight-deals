# Facts from the hotel's own website (hotelanders.pl; robots.txt allows all, checked 2026-11-08):
# /dla-dzieci, /spa-wellness/hotel-z-basenem-mazury, /kontakt, /hotel/wazne-informacje, the parking and pool
# regulations (PDFs on wa-uploads.profitroom.com/hotelanders). Written in our words.
# Also on the site, no feature key for it: paid babysitting on request; children's bikes and bikes with child
# seats for hire (10 zł per bike per hour); a paediatrician's phone number at reception; nappy bags in the room,
# disposable bibs and plastic dishes in the restaurant. Pool (indoor per the photo caption, 07:00-21:00, free
# for guests); pool rules: children under 7 only with supervision, under 3 only in swim nappies; no brodzik
# mentioned. "Dziecko do lat 12 gratis" appears only in dated offers (Nov-Dec 2026), not as a hotel rule.
# Not stated (so not recorded yet): cot fee, free-stay age, bottle warmer, potty, paddling pool, lift, parking fee.
#
# Coordinates: OpenStreetMap way/356651141 (centre; (c) OpenStreetMap contributors, ODbL); the hotel's map link
# is a short link without coordinates.
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet (nearest station Stare Jabłonki, regional line Olsztyn-Iława).
