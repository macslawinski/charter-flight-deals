# Facts from the hotel's own website (wavemiedzyzdroje.pl; robots.txt allows all but one plugin file,
# checked 2026-11-07): /dla-dzieci/, /kontakt/, /apartamenty/, home page, Regulamin obiektu (PDF, 2026).
# Written in our words.
# Also on the site, no feature key for it: children under 13 must be under constant adult care and may use the
# buffet only with an adult (regulamin); the resort is mostly apartments; Wave Beach Concept venue on the beach.
# Not stated (so not recorded yet): cot fee, baby bath, bottle warmer, changing table, potty, high chair,
# brodzik or kids' pool details, Kids Zone hours and minimum age, lift, beach distance, parking fee.
# Fewer than 8 verified facts: the site says little more for 0-3.
#
# Coordinates: OpenStreetMap way/171601784 (ODbL); no map link with coordinates on the hotel's site.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Międzyzdroje station (times reused from Hotel Wolin, same station). Station -> hotel: ~2 km,
#   ~5 min by car or taxi (OSRM).
slug = "wave-miedzyzdroje"
place = "miedzyzdroje"
name = "Wave Międzyzdroje Resort & SPA"
official_url = "https://wavemiedzyzdroje.pl/"
address = "ul. Gryfa Pomorskiego 70, 72-500 Międzyzdroje"
lat = 53.9259392  # OpenStreetMap way/171601784, ODbL
lon = 14.4337753
status = "draft"

[[feature]]
key = "cot"
value = { available = true, on_request = true }
short = "Na życzenie"
note = "Łóżeczka dla dzieci w pokojach na życzenie gości. Opłaty strona nie podaje."
source = "hotel_website"
url = "https://wavemiedzyzdroje.pl/dla-dzieci/"
verified_at = 2026-11-07

[[feature]]
key = "child_free_stay"
age_band = "0-3"
value = { free = true, sleeping_with_parents = true }
short = "Do lat 3 bezpłatnie, bez osobnego łóżka"
note = "Pobyt dzieci do lat 3 jest bezpłatny: wyżywienie jak w ofercie rodziców i ręczniki, ale bez osobnego miejsca do spania (regulamin obiektu, s. 6). Kwestii trzylatka strona nie rozstrzyga."
source = "hotel_website"
url = "https://wavemiedzyzdroje.pl/wp-content/uploads/2026/05/Regulamin-obiektu-Wave-Miedzyzdroje-Resort-SPA26.pdf"
verified_at = 2026-11-07

[[feature]]
key = "kids_menu"
value = { available = true }
short = "Kilka pozycji dla maluchów"
note = "W restauracji kilka pozycji przygotowanych z myślą o maluchach. O jedzeniu dla niemowląt strona nie wspomina."
source = "hotel_website"
url = "https://wavemiedzyzdroje.pl/dla-dzieci/"
verified_at = 2026-11-07

[[feature]]
key = "playroom"
value = { available = true, age_zones = true }
short = "Kids Zone ze strefami wiekowymi"
note = "Kids Zone podzielona na strefy dla dzieci w różnym wieku. Godzin, minimalnego wieku i zasad opieki strona nie podaje."
source = "hotel_website"
url = "https://wavemiedzyzdroje.pl/dla-dzieci/"
verified_at = 2026-11-07

[[feature]]
key = "playground"
value = { available = true, outdoor = true }
short = "W ogrodzie, maj–wrzesień też na plaży"
note = "Zewnętrzny plac zabaw w ogrodzie resortu (m.in. mini ścianka wspinaczkowa); od maja do września także plac zabaw w Wave Beach Concept."
source = "hotel_website"
url = "https://wavemiedzyzdroje.pl/dla-dzieci/"
verified_at = 2026-11-07

[[feature]]
key = "kids_animation"
value = { available = true, seasonal = true }
short = "Święta, długie weekendy, ferie, wakacje"
note = "W święta, długie weekendy, ferie i wakacje z dziećmi jest animatorka; od maja do września animacje w Wave Beach Concept. Przedziału wieku strona nie podaje."
source = "hotel_website"
url = "https://wavemiedzyzdroje.pl/dla-dzieci/"
verified_at = 2026-11-07

[[feature]]
key = "parking"
value = { paid = true, garage = true, reservation_required = true, max_height_m = 2 }
short = "Płatny garaż, wymagana rezerwacja"
note = "Ograniczona liczba płatnych miejsc w garażu podziemnym (niestrzeżony, monitorowany, do 2 m wysokości); wymagana rezerwacja. Kwoty strona nie podaje."
source = "hotel_website"
url = "https://wavemiedzyzdroje.pl/wp-content/uploads/2026/05/Regulamin-obiektu-Wave-Miedzyzdroje-Resort-SPA26.pdf"
verified_at = 2026-11-07

