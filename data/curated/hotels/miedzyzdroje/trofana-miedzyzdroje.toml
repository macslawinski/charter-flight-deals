# Facts from the hotel's own website (hotel-trofana.pl; robots.txt allows all, checked 2026-11-07):
# /hotel/dzieci, home page. Written in our words.
# Also on the site, no feature key for it: pram storage in the lobby; colouring books in the restaurant; bibs;
# kettle, blanket and socket covers in the room; nappy bags and bathroom step; Summer Golf Kids Akademia (golf
# lessons, "every age"); the kids page is titled "hotel z animacjami" and the home page names a "miejsce zabaw
# dla dzieci", but neither describes them, so no animation or playroom fact is recorded.
# Not stated (so not recorded yet): free-stay age, cot fee, bottle warmer, changing table, playroom details,
# animation ages, brodzik, lift, parking.
# Fewer than 8 verified facts: the site says little more for 0-3.
#
# Coordinates: the hotel's own Google Maps link.
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Międzyzdroje station (times reused from Hotel Wolin, same station). Station -> hotel: ~1 km,
#   ~5 min by car (OSRM) or a short walk.
