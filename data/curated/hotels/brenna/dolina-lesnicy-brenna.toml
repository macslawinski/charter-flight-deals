# Facts from the hotel's own website (dolinalesnicy.pl; robots.txt has no Disallow, checked 2026-11-08):
# /atrakcje/dla-dzieci, /regulaminy and the resort rules PDF
# (wa-uploads.profitroom.com/dolinalesnicyskisparesort/..._regulamin_resortu.pdf). Written in our words.
# Also on the site, no feature key for it: plastic tableware and cutlery for children; heated indoor pool
# supervised by a lifeguard (no brodzik mentioned); resort rules: children under 13 must be under constant
# supervision and use the buffet only with an adult.
# Not stated (so not recorded yet): cot fee, baby bath, changing table, potty, bottle warmer, baby monitor,
# lift, playroom age and hours, parking.
#
# Coordinates: OpenStreetMap node/2489413539 ((c) OpenStreetMap contributors, ODbL); the site gives no map
# coordinates.
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet (Skoczów / Ustroń, regional trains only).
