# Facts from the hotel's own website (olandia.pl; robots.txt allows all, checked 2026-11-08):
# /miejsce-dla-dzieci, the "Udogodnienia dla dzieci 2025" PDF it links (u.profitroom.com/2018-olandia-pl),
# /atrakcje/szczegoly-atrakcji?RecordID=48556, /sport-i-rekreacja/basen, /kontakt. Written in our words.
# Also on the site, no feature key for it: on request outlet covers, a humidifier and an electric kettle, plastic
# tableware for children, glass and plants removed from tables; reception keeps phone numbers of a GP,
# paediatrician and pharmacy, a first-aid kit and a contactless thermometer; stroller storage; children's books
# and family games to borrow; bikes with child seats and helmets; a beach (distance not stated); indoor pool
# open to hotel guests (the price list for non-guests charges children 3-16). The hotel takes part in the
# "Hotel Przyjazny Rodzinie" programme.
# Not stated (so not recorded yet): fees for the baby items, playroom minimum age / hours, animation ages,
# kids' basin depth, lift, parking.
#
# Coordinates: OpenStreetMap way/536491772, ODbL (no map link with coordinates on the site).
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet.
