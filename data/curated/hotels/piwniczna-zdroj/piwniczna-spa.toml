# Facts from the hotel's own website (hotelpiwniczna.pl; robots.txt allows all, checked 2026-11-08):
# /dzieci, /kontakt, Regulamin Hotelu and Regulamin HedoniSPA (PDFs, linked from /odkryj-hotel/regulamin).
# Written in our words.
# Also on the site, no feature key for it: a paid babysitter; children under 12 must stay under their guardians'
# supervision anywhere in the hotel; HedoniSPA only with a guardian for under-18s, swim nappies required for
# children in nappies; children's bikes to hire.
# Not stated (so not recorded yet): cot fee, free-stay age, high chair, changing table, baby monitor, lift,
# playroom age and hours, brodzik depth and temperature, parking fee.
#
# Coordinates: the hotel's own map link on /kontakt (marker 49.4319303, 20.7080882).
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet (Piwniczna-Zdrój station, regional trains only).
