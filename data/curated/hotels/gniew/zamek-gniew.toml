# Facts from the hotel's own website (zamek-gniew.pl; robots.txt allows all, checked 2026-11-07):
# /hotel/hotel-z-sala-i-placem-zabaw-dla-dzieci (with its FAQ), /kontakt, home page. Written in our words.
# Also on the site, no feature key for it: bouncy castles and mini golf outside in good weather; knight shows,
# castle tours and bowling; car-free courtyard. Indoor pool with water attractions and jacuzzi (no brodzik
# mentioned). Hotel rooms are in Pałac Marysieńki; satnav address ul. Sobieskiego 11.
# Not stated (so not recorded yet): free-stay age, fees for baby items, bottle warmer, changing table, potty,
# toddler food, playroom hours and minimum age, animation ages, brodzik, lift, parking.
#
# Coordinates: OpenStreetMap way/192583614 (ODbL).
# Access (checked 2026-11-07):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: rozklad-pkp.pl, Thursday 2026-11-12, departures 05:00-14:00; fastest connection with at most one
#   change, to Pelplin station (Gniew has no passenger station). Station -> hotel: ~16 km, ~20 min by car or
#   taxi (OSRM).
