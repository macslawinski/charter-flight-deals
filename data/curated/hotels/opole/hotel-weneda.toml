note = "FAQ: bezpłatne miejsca przed i za hotelem, bez rezerwacji i bez gwarancji; miejsce w garażu podziemnym 40 zł za samochód (okresu strona nie podaje)."
source = "hotel_website"
url = "https://hotel-weneda.pl/faq"
verified_at = 2026-11-08

