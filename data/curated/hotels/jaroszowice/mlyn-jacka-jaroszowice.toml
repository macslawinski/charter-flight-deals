# Facts from the hotel's own website (hotelmj.pl; robots.txt has no Disallow, checked 2026-11-08):
# /hotel-dla-dzieci, /spa/basen-wellness, /kontakt, Regulamin hotelu and Regulamin strefy wellness (PDFs,
# linked from /kontakt). Written in our words.
# Also on the site, no feature key for it: main pool 100 m2, 130 cm deep, about 30°C; wellness 8:00-21:00
# (Fri-Sat to 22:00); children under 12 only under an adult's care, swim nappies required for children in
# nappies (wellness regulamin); indoor playground STARKI in Wadowice (ages 1-11, separate business, a few
# minutes by car).
# Not stated (so not recorded yet): cot (not on the kids page any more), free-stay age, changing table, bottle
# warmer, baby monitor, lift, brodzik depth.
#
# Coordinates: OpenStreetMap way/295644809 (centre; (c) OpenStreetMap contributors, ODbL); the site's map links
# are short links.
# Access (checked 2026-11-08):
# - car: OSRM public router (OpenStreetMap data), city centre -> hotel, free-flow time rounded to 5 min.
# - train: not checked yet.
