# Endpoint definitions per operator. No secrets here: cookies/tokens go to .env.

[defaults]
min_delay_seconds = 3.0
max_delay_seconds = 8.0
max_requests_per_run = 250   # r.pl full crawl is ~1 + 38 + ~50 requests; see ingest/sources/r_pl.py
max_retries = 4
timeout_seconds = 30
user_agent = "charter-flight-deals/0.1 (price research PoC)"

# r.pl (Rainbow) charter flights ("Czartery", https://r.pl/bilety-czarterowe).
# Undocumented JSON API, discovered 2026-11-04. Works without cookies. Flow per run:
#   1. GET wyszukiwanie/v4.1/wyszukaj            -> destinations (IATA in Destynacje[].Klucz)
#   2. GET destynacja/v4.1/wyszukaj-wylot        -> outbound legs per destination (all origins)
#   3. GET destynacja/v4.1/wyszukaj-przylot      -> return legs for a batch of pakietId values;
#      Bilety[].CenaRazem = round-trip total for all passengers (BindId -> outbound pakiet).
[sources.r_pl]
operator = "r_pl"
enabled = true
method = "GET"
url = "https://r.pl/api/czartery"
headers = { "Accept" = "application/json" }
cookie_env = "RPL_COOKIE"  # not required as of 2026-11-04; leave unset in .env

[sources.r_pl.payload]
# Passenger birth dates (adults). Price per person = CenaRazem / number of passengers.
birth_dates = ["1990-01-01"]
horizon_days = 365          # dataMax = today + horizon_days
pakiet_batch_size = 200     # pakietId values per wyszukaj-przylot request (URL ~4.7 KB;
                            # 200 verified identical to 4x50 on 2026-11-04; ~9k pakiety total)

# Itaka charter flights ("Loty czarterowe - Bilety lotnicze", https://www.itaka.pl/bilety-lotnicze/).
# No JSON API: the listing is a Next.js page; with header `RSC: 1` it returns the React Server
# Components payload, one line of which is plain JSON {"flightsList": [...20 offers], "pagesCount",
# "rateCount"}. Discovered 2026-11-04; works without cookies. The URL 307-redirects to an internal
# /multitenant/flights path, so redirects are followed. ~150 pages per run (fixed 20 per page),
# sorted by departure date so offers don't jump between pages when prices change mid-crawl.
# Runs twice a day (see .github/workflows/ingest.yml), not every 6 h.
[sources.itaka]
operator = "itaka"
enabled = true
method = "GET"
url = "https://www.itaka.pl/bilety-lotnicze/"
headers = { "RSC" = "1" }
follow_redirects = true

[sources.itaka.payload]
adults = 1                  # price per person = pricePerPerson for a single adult
max_pages = 220             # safety cap; ~150 pages as of 2026-11-04

# Reference prices of regular airlines (display-only, see db/migrations/005_market_fares.sql).
# Official Travelpayouts / Aviasales Data API, free affiliate token in .env. Cached prices found
# by Aviasales users in the last days, so coverage is good 1-3 months ahead and thin beyond.
# One request per segment (origin + destination + month), direct flights only. Run:
#   python -m ingest.market
[sources.travelpayouts]
operator = "travelpayouts"
enabled = true
method = "GET"
url = "https://api.travelpayouts.com/aviasales/v3/prices_for_dates"
headers = { "Accept" = "application/json" }
token_env = "TRAVELPAYOUTS_TOKEN"
token_header = "X-Access-Token"

[sources.travelpayouts.payload]
horizon_days = 120          # only segments departing within this many days (coverage beyond is thin)
max_segments_per_run = 40   # rotation: deal segments first, then the least recently fetched
limit = 1000                # fares per response
