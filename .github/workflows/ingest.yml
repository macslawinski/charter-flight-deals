name: ingest

on:
  workflow_dispatch:
  schedule:
    # Every 6 h at :17 UTC (off the top of the hour). A full r.pl run is ~100 requests, ~10 min.
    # Exit code 3 (request cap hit, data incomplete) fails the job on purpose so it gets noticed.
    - cron: "17 */6 * * *"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m ingest.run --source r_pl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RPL_COOKIE: ${{ secrets.RPL_COOKIE }}

  web:
    needs: ingest
    uses: ./.github/workflows/web.yml
    secrets: inherit
