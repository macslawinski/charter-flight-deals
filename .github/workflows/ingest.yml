name: ingest

on:
  workflow_dispatch:
    inputs:
      market_only:
        description: "Only refresh regular-airline reference prices (skip the r.pl and Itaka crawls)"
        type: boolean
        default: false
      itaka:
        description: "Also crawl Itaka (otherwise only on the 00:17 / 16:17 UTC cron)"
        type: boolean
        default: false
  schedule:
    # r.pl three times a day (~90 requests, ~9 min), Itaka twice (~150 pages, ~14 min) in a
    # parallel job: different sites, so each still gets one polite request at a time.
    # The repo is private: Actions minutes are capped (2000/month), keep the schedule lean.
    # 00:17 UTC is the first run of a new Europe/Warsaw snapshot_date, so the new day's deals
    # include both operators from the start. The Itaka job matches the schedule string, not the
    # clock, so a run delayed in GitHub's queue still counts. Exit code 3 (request cap hit, data
    # incomplete) fails the step.
    - cron: "17 0,16 * * *"   # r.pl + Itaka
    - cron: "17 8 * * *"      # r.pl only

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  rpl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: python -m ingest.run --source r_pl
        if: ${{ !inputs.market_only }}  # null on cron runs -> r.pl crawl runs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RPL_COOKIE: ${{ secrets.RPL_COOKIE }}
      # Regular-airline reference prices (display-only), in this job to save a runner start-up.
      # Segments are route + month, shared by both operators; Itaka-only deal segments are
      # prioritized on the next run. Must not block the deploy: a failure only shows as a warning.
      - run: python -m ingest.market
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}

  # Second operator, independent of r.pl: continue-on-error so an Itaka failure doesn't block
  # the deploy.
  itaka:
    if: ${{ !inputs.market_only && (inputs.itaka || github.event.schedule == '17 0,16 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: python -m ingest.run --source itaka
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Deploy once both crawls are done (the Itaka job may be skipped); not when r.pl failed.
  web:
    needs: [rpl, itaka]
    if: ${{ !cancelled() && needs.rpl.result == 'success' }}
    uses: ./.github/workflows/web.yml
    secrets: inherit
