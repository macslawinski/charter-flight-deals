name: ingest

on:
  workflow_dispatch:
  # Enable once the r.pl source is implemented and DATABASE_URL secret is set:
  # schedule:
  #   - cron: "17 */6 * * *"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m ingest.run --source r_pl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RPL_COOKIE: ${{ secrets.RPL_COOKIE }}
