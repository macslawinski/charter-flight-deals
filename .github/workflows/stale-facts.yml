name: stale-facts

# Monthly reminder (PLAN.md §3): list curated facts that expire within 30 days and keep one open
# issue labelled `stale-facts` with the list. Re-check them with the reverify-facts skill. The site
# flags expired facts by itself ("do ponownego sprawdzenia"); this only makes sure someone looks.
# ~1 Actions minute a month.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 1 * *"   # 1st of the month, 06:23 UTC

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: python scripts/stale_facts.py --within-days 30 | tee due.txt
      - name: Open or update the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^nothing due' due.txt; then exit 0; fi
          {
            echo 'Curated facts due for re-verification within 30 days (`python scripts/stale_facts.py`).'
            echo 'Re-check them with the `reverify-facts` skill; expired ones already show "do ponownego sprawdzenia" on the site.'
            echo
            echo '```'
            head -c 60000 due.txt
            echo '```'
          } > body.md
          gh label create stale-facts --color FBCA04 --description "Facts due for re-verification" --force
          title="Re-verify curated facts ($(date -u +%Y-%m))"
          num=$(gh issue list --state open --label stale-facts --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$title" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md --label stale-facts
          fi
