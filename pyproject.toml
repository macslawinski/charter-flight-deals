[project]
name = "charter-flight-deals"
version = "0.1.0"
description = "Tracks flight-only charter prices from Polish tour operators and flags genuine deals."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",  # zoneinfo has no system tz database on Windows
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
cfd-ingest = "ingest.run:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["ingest", "scripts", "tests", ".claude/hooks"]

[tool.ruff]
line-length = 100
target-version = "py312"
